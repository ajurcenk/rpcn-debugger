# output.processors: each child runs after the pipeline, before the output.
# Same-batch rule: the input yields exactly one batch of at most 10 messages
# (the maxMessages default), so the debugger captures the whole input.
input:
  generate:
    count: 2
    batch_size: 2
    interval: ""
    mapping: |
      root.n = counter()

pipeline:
  processors:
    - mapping: 'root = this.merge({"from_pipeline": true})'

output:
  processors:
    - mapping: |
        root = this
        root.from_output = true
    - mutation: 'meta stage = "output"'
  drop: {}
