# input.processors: each child runs on the captured batch before the pipeline.
# Same-batch rule: the input yields exactly one batch of at most 10 messages
# (the maxMessages default), so the debugger captures the whole input.
input:
  generate:
    count: 2
    batch_size: 2
    interval: ""
    mapping: |
      root.n = counter()
  processors:
    - mapping: |
        root = this
        root.from_input = true
    - mutation: 'meta stage = "input"'

pipeline:
  processors:
    - mapping: 'root = this.merge({"from_pipeline": true})'

output:
  drop: {}
