# Sample equivalence case: three generated messages through one mapping.
# Same-batch rule: the input yields exactly one batch of at most 10 messages
# (the maxMessages default), so the debugger captures the whole input.
input:
  generate:
    count: 3
    batch_size: 3
    interval: ""
    mapping: |
      root.n = counter()

pipeline:
  # One thread keeps the messages in input order; more may reorder them.
  threads: 1
  processors:
    - mapping: |
        root.n = this.n
        root.doubled = this.n * 2

output:
  drop: {}
