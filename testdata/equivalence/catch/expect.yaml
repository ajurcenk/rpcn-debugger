# Expectations TestCases and TestEquivalence check beside the AD-8 comparison:
# the reference run's batches and messages, the Step In stops (path and frame
# count) that prove ctx reaches each nested child (AD-17), paths no run may
# stop inside, and Debug Console output every run must show.
# catch clears the error of the message it caught.
batches: [3]
messages:
  - content: '{"done":true,"n":1}'
  - content: '{"caught":"failed assignment (line 1): n is 2","done":true,"n":2}'
    error: ''
  - content: '{"done":true,"n":3}'
stops:
  - path: 'pipeline.processors[1].catch[0]'
    frames: 2
