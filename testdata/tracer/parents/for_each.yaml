# for_each demo: one batch of 3 messages. Press F5 and Step In: for_each
# enters its list once per message, and the call stack labels each entry
# [msg 1/3], [msg 2/3], [msg 3/3].
input:
  generate:
    count: 10
    batch_size: 3
    interval: ""
    mapping: |
      root.n = counter()

pipeline:
  processors:
    - for_each:
        - mapping: |
            root = this
            root.seen = true

output:
  drop: {}
