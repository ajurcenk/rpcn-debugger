# catch demo: 3 messages; the first processor fails message 2. Press F5 and
# Step In: catch enters its list once, for message 2 only, and clears its
# error afterwards.
input:
  generate:
    count: 3
    batch_size: 3
    interval: ""
    mapping: |
      root.n = counter()

pipeline:
  processors:
    - mapping: 'root = if this.n == 2 { throw("n is 2") } else { this }'
    - catch:
        - mapping: 'root = this.merge({"caught": true})'

output:
  drop: {}
