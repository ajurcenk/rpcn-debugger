# https://taskfile.dev
version: '3'

env:
  # The stock binary is pure Go: the only CGO components in Connect v4.112.0
  # sit behind the x_benthos_extra build tag, which is never set.
  CGO_ENABLED: '0'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.date={{.DATE}}

tasks:
  build:go:
    desc: Build the stock rpcn-debug binary into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/rpcn-debug ./cmd/rpcn-debug

  lint:go:
    desc: Lint the Go code (AD-2 public API only, AD-15 stdout belongs to DAP)
    cmds:
      - go tool -modfile=tools/go.mod golangci-lint run ./...

  lint:gomod:
    desc: Fail on replace directives for benthos/connect (AD-2)
    cmds:
      - |
        modjson=$(go mod edit -json) || { echo "lint:gomod: cannot read go.mod" >&2; exit 1; }
        bad=$(printf '%s' "$modjson" | jq -r '.Replace // [] | .[].Old.Path | select(test("^github\\.com/redpanda-data/(benthos|connect)(/|$)"))') || exit 1
        if [ -n "$bad" ]; then
          for p in $bad; do echo "AD-2: replace directive for $p is forbidden" >&2; done
          exit 1
        fi

  gen:schema:
    desc: Generate the launch.json schema and initialConfigurations in vscode/package.json from dap.LaunchConfig (AD-12)
    cmds:
      - go run ./cmd/gen-launch-schema

  lint:schema:
    desc: Fail if vscode/package.json's launch schema is stale against dap.LaunchConfig (AD-12)
    cmds:
      - go run ./cmd/gen-launch-schema -check

  test:go:
    desc: Run the Go tests
    cmds:
      - go test ./...

  test:equivalence:
    desc: Run the AD-8 equivalence cases in testdata/equivalence/ (reference runs), listing each case
    cmds:
      - go test -count=1 -v -run '^TestCases$' ./test/equivalence/

  test:integration:
    desc: Run the integration tests against Docker containers (needs Docker)
    env:
      # Ryuk removes the containers if the test binary dies before t.Cleanup
      # runs, so it stays on. It exits 1s after the test disconnects.
      TESTCONTAINERS_RYUK_DISABLED: 'false'
      TESTCONTAINERS_RYUK_RECONNECTION_TIMEOUT: 1s
    cmds:
      - go test -tags integration -count=1 -timeout 10m ./test/integration/...
      - |
        left=$(docker ps -aq --filter label=rpcn-debugger.test=integration) || exit 1
        if [ -n "$left" ]; then echo "test:integration: containers left behind: $left" >&2; exit 1; fi

  build:ext:
    desc: Install the extension's npm dependencies and compile it
    dir: vscode
    cmds:
      - npm ci --no-audit --no-fund
      - npx --no-install tsc -p ./

  test:ext:
    desc: Run the extension's DAP test against the built rpcn-debug binary (needs build:go and build:ext)
    dir: vscode
    env:
      # Relative to vscode/. Override to test another binary.
      RPCN_DEBUG_BIN: '{{.RPCN_DEBUG_BIN | default "../bin/rpcn-debug"}}'
    cmds:
      - npm test

  package:ext:
    desc: Package the extension as a .vsix into vscode/dist/
    dir: vscode
    cmds:
      - rm -rf dist
      - mkdir -p dist
      - npx --no-install vsce package --no-dependencies -o dist/

  ci:
    desc: Build, test and package everything, non-interactively
    cmds:
      - task: build:go
      - task: lint:go
      - task: lint:gomod
      - task: lint:schema
      - task: test:go
      - task: test:equivalence
      - task: test:integration
      - task: build:ext
      - task: test:ext
      - task: package:ext
